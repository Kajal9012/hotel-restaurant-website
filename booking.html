<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book a Table</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
     <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="booking.css">
</head>
<body>


<section class="booking-section">
  <div class="booking-container">
<span class="close-btn" onclick="closePage()">×</span>

    <!-- LEFT CONTENT -->
    <div class="booking-info" data-aos="fade-down" data-aos-delay="50" data-aos-duration="1000">
    
      <h1>Book A Table Online</h1>
      <p>
       Table reservation for the selected date and time. No special requirements
      </p>
      <img src="table1.jpg" alt="Restaurant Booking" data-aos="flip-right" data-aos-delay="50" data-aos-duration="1000">
    </div>

    <!-- RIGHT FORM -->
    <div class="booking-form" data-aos="fade-down" data-aos-delay="50" data-aos-duration="1000">
      <form id="bookingForm">

        <div class="form-group">
          <input type="text" pattern="[A-Za-z ]+" id="name" required>
          <label>Your Name <span style="color: red;">*</span></label>
        </div>

        <div class="form-group">
          <input type="email" id="email" required>
          <label>Your Email <span style="color: red;">*</span></label>
        </div>

        <div class="form-group">
          <input type="datetime-local" id="datetime" required>
          <label>Date & Time <span style="color: red;">*</span></label>
        </div>

        <div class="form-group">
          <select id="people" required>
           
            <option value="">Select People</option>
            <option>1 Person</option>
            <option>2 People</option>
            <option>3 People</option>
            <option>4+ People</option>
          </select>
        </div>

        <div class="form-group">
          <textarea id="message" rows="4"></textarea>
          <label>Special Request</label>
        </div>

        <button type="submit" class="btn-book">Book Now</button>

      </form>
    </div>

  </div>
 
</section>
 <script src="booking.js"></script>
 <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({
    once: false,  // Important: repeat animation on scroll up
  });
</script>
</body>
</html>
